<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Laboratório 3D - Transferência</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            gap: 80px;
            perspective: 800px; /* Dá profundidade ao cenário */
        }

        /* Container do Frasco com efeito de vidro 3D */
        .frasco {
            position: relative;
            width: 100px;
            height: 150px;
            background: linear-gradient(90deg, 
                rgba(255,255,255,0.1) 0%, 
                rgba(255,255,255,0.2) 20%, 
                rgba(255,255,255,0.05) 50%, 
                rgba(255,255,255,0.2) 80%, 
                rgba(255,255,255,0.1) 100%);
            border-radius: 0 0 20px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: none;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.1);
            transform-style: preserve-3d;
        }

        /* Topo (Boca do vidro em 3D) */
        .frasco::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; /* Formato elíptico para parecer circular em perspectiva */
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
        }

        /* Líquido com gradiente para volume */
        .substancia {
            position: absolute;
            bottom: 0;
            width: 100%;
            border-radius: 0 0 20px 20px;
            opacity: 0.8;
            transition: height 0.1s linear;
        }

        /* Efeito de topo do líquido (a "onda" circular interna) */
        .substancia::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 100%;
            height: 20px;
            border-radius: 50%;
            background: inherit;
            filter: brightness(1.2);
        }

        /* Cores e Animações */
        .azul { 
            background: radial-gradient(circle at 50% 50%, #00a2ff, #0055ff);
            box-shadow: 0 0 40px rgba(0, 119, 255, 0.5);
            animation: encher 2s ease-in-out infinite alternate;
        }
        
        .amarelo { 
            background: radial-gradient(circle at 50% 50%, #ffee00, #ffaa00);
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.5);
            animation: esvaziar 2s ease-in-out infinite alternate;
        }

        /* Brilho Lateral (Reflexo 3D) */
        .reflexo-3d {
            position: absolute;
            top: 20px;
            left: 15px;
            width: 8px;
            height: 70%;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            filter: blur(1px);
        }

        @keyframes encher {
            0% { height: 10%; }
            100% { height: 85%; }
        }

        @keyframes esvaziar {
            0% { height: 85%; }
            100% { height: 10%; }
        }

        /* Leve balanço 3D no frasco inteiro */
        .frasco {
            animation: tilt 4s ease-in-out infinite alternate;
        }

        @keyframes tilt {
            0% { transform: rotateY(-10deg) rotateX(5deg); }
            100% { transform: rotateY(10deg) rotateX(5deg); }
        }
    </style>
</head>
<body>

    <div class="frasco">
        <div class="reflexo-3d"></div>
        <div class="substancia azul"></div>
    </div>

    <div class="frasco">
        <div class="reflexo-3d"></div>
        <div class="substancia amarelo"></div>
    </div>

</body>
</html>
